<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Documents - Admin - Nairobi Talks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .sidebar { min-height: 100vh; background: #1a1a1a; }
    .sidebar a { color: #aaa; text-decoration: none; padding: 12px 20px; display: block; }
    .sidebar a:hover, .sidebar a.active { background: #333; color: #fff; }
  </style>
</head>
<body class="bg-light">
  <div class="d-flex">
    <nav class="sidebar d-none d-md-block" style="width:250px;position:fixed;height:100vh;">
      <div class="p-3">
        <h5 class="text-white fw-bold">Nairobi Talks</h5>
        <small class="text-white-50">Admin Panel</small>
      </div>
      <hr class="border-secondary">
      <a href="index.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
      <a href="ideas.html"><i class="bi bi-lightbulb me-2"></i> Community Ideas</a>
      <a href="documents.html" class="active"><i class="bi bi-file-earmark-text me-2"></i> Planning Documents</a>
      <a href="users.html"><i class="bi bi-people me-2"></i> Users</a>
      <a href="analytics.html"><i class="bi bi-graph-up me-2"></i> Analytics</a>
      <a href="broadcasts.html"><i class="bi bi-megaphone me-2"></i> Broadcasts</a>
      <a href="forums.html"><i class="bi bi-chat-dots me-2"></i> Forum</a>
      <hr class="border-secondary">
      <a href="../index.html"><i class="bi bi-house me-2"></i> View Site</a>
      <a href="#"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
    </nav>

    <div class="flex-grow-1 p-4" style="margin-left:250px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="mb-1 fw-bold" style="color:#009339;">Planning Documents</h2>
          <p class="text-muted mb-0">Manage official planning documents</p>
        </div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#uploadModal">
          <i class="bi bi-plus-circle me-2"></i>Upload Document
        </button>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th class="px-4">Title</th>
                  <th>Type</th>
                  <th>Year</th>
                  <th>Sub-county</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="documents-table">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Upload Planning Document</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="uploadForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Title</label>
              <input type="text" class="form-control" id="docTitle" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Type</label>
              <select class="form-select" id="docType" required>
                <option value="Master Plan">Master Plan</option>
                <option value="Infrastructure">Infrastructure</option>
                <option value="Proposal">Proposal</option>
                <option value="Report">Report</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Year</label>
              <select class="form-select" id="docYear" required>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Sub-county</label>
              <select class="form-select" id="docSubcounty" required>
                <option value="All">All</option>
                <option value="Westlands">Westlands</option>
                <option value="Kibra">Kibra</option>
                <option value="Embakasi">Embakasi</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Document File</label>
              <input type="file" class="form-control" accept=".pdf,.doc,.docx">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" onclick="uploadDocument()">Upload</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://tfnvacmwachpadhekfzm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1lebrtqeey5Ni62L7TA4rA_4fTTete7';
    const USE_DEMO_MODE = false;
    
    let supabase;
    if (!USE_DEMO_MODE && SUPABASE_URL !== 'https://tfnvacmwachpadhekfzm.supabase.co') {
      const { createClient } = window.supabase;
      supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    }
    
    let documents = [
      { id: 1, title: 'Nairobi Integrated Urban Development Plan 2025', type: 'Master Plan', year: '2025', sub_county: 'All', status: 'Published', date: '2025-01-15' },
      { id: 2, title: 'Westlands Traffic Management Plan', type: 'Infrastructure', year: '2024', sub_county: 'Westlands', status: 'Published', date: '2024-11-20' },
      { id: 3, title: 'Kibra Community Development Proposal', type: 'Proposal', year: '2025', sub_county: 'Kibra', status: 'Draft', date: '2025-02-10' }
    ];

    function viewDocument(id) {
      const doc = documents.find(d => d.id === id);
      if (doc) alert(`Viewing: ${doc.title}\n\nType: ${doc.type}\nYear: ${doc.year}\nStatus: ${doc.status}`);
    }

    function editDocument(id) {
      const doc = documents.find(d => d.id === id);
      if (doc) {
        const newStatus = prompt('Enter new status (Draft/Published):', doc.status);
        if (newStatus) {
          doc.status = newStatus;
          renderDocuments();
          showToast('Document updated!');
        }
      }
    }

    function deleteDocument(id) {
      const doc = documents.find(d => d.id === id);
      if (doc && confirm(`Delete "${doc.title}"?`)) {
        documents = documents.filter(d => d.id !== id);
        renderDocuments();
        showToast('Document deleted!');
      }
    }

    function uploadDocument() {
      const title = document.getElementById('docTitle').value;
      const type = document.getElementById('docType').value;
      const year = document.getElementById('docYear').value;
      const subcounty = document.getElementById('docSubcounty').value;
      
      if (!title) {
        alert('Please enter a title');
        return;
      }
      
      documents.unshift({
        id: Date.now(),
        title, type, year, sub_county: subcounty,
        status: 'Draft',
        date: new Date().toISOString().split('T')[0]
      });
      
      renderDocuments();
      bootstrap.Modal.getInstance(document.getElementById('uploadModal')).hide();
      document.getElementById('uploadForm').reset();
      showToast('Document uploaded successfully!');
    }

    function renderDocuments() {
      document.getElementById('documents-table').innerHTML = documents.map(doc => `
        <tr>
          <td class="px-4 fw-medium">${doc.title}</td>
          <td>${doc.type}</td>
          <td>${doc.year}</td>
          <td>${doc.sub_county}</td>
          <td><span class="badge ${doc.status === 'Published' ? 'bg-success' : 'bg-warning text-dark'}">${doc.status}</span></td>
          <td class="text-muted">${doc.date}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="viewDocument(${doc.id})"><i class="bi bi-eye"></i></button>
            <button class="btn btn-sm btn-outline-success me-1" onclick="editDocument(${doc.id})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteDocument(${doc.id})"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'position-fixed bottom-0 end-0 m-3 alert alert-success shadow';
      toast.style.zIndex = '9999';
      toast.innerHTML = '<i class="bi bi-check-circle me-2"></i>' + message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    renderDocuments();
  </script>
</body>
</html>
