<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Admin - Nairobi Talks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .sidebar { min-height: 100vh; background: #1a1a1a; }
    .sidebar a { color: #aaa; text-decoration: none; padding: 12px 20px; display: block; }
    .sidebar a:hover, .sidebar a.active { background: #333; color: #fff; }
  </style>
</head>
<body class="bg-light">
  <div class="d-flex">
    <nav class="sidebar d-none d-md-block" style="width:250px;position:fixed;height:100vh;">
      <div class="p-3">
        <h5 class="text-white fw-bold">Nairobi Talks</h5>
        <small class="text-white-50">Admin Panel</small>
      </div>
      <hr class="border-secondary">
      <a href="index.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
      <a href="ideas.html"><i class="bi bi-lightbulb me-2"></i> Community Ideas</a>
      <a href="documents.html"><i class="bi bi-file-earmark-text me-2"></i> Planning Documents</a>
      <a href="users.html" class="active"><i class="bi bi-people me-2"></i> Users</a>
      <a href="analytics.html"><i class="bi bi-graph-up me-2"></i> Analytics</a>
      <a href="broadcasts.html"><i class="bi bi-megaphone me-2"></i> Broadcasts</a>
      <a href="forums.html"><i class="bi bi-chat-dots me-2"></i> Forum</a>
      <hr class="border-secondary">
      <a href="../index.html"><i class="bi bi-house me-2"></i> View Site</a>
      <a href="#"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
    </nav>

    <div class="flex-grow-1 p-4" style="margin-left:250px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="mb-1 fw-bold" style="color:#009339;">Users</h2>
          <p class="text-muted mb-0">Manage registered users</p>
        </div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addUserModal">
          <i class="bi bi-plus-circle me-2"></i>Add User
        </button>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th class="px-4">User</th>
                  <th>Role</th>
                  <th>Ideas</th>
                  <th>Comments</th>
                  <th>Joined</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="users-table">
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add User Modal -->
  <div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Add New User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addUserForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" class="form-control" id="userEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Name</label>
              <input type="text" class="form-control" id="userName" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Role</label>
              <select class="form-select" id="userRole">
                <option value="user">User</option>
                <option value="admin">Admin</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-success" onclick="addUser()">Add User</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://tfnvacmwachpadhekfzm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_1lebrtqeey5Ni62L7TA4rA_4fTTete7';
    const USE_DEMO_MODE = false;
    
    let supabase;
    if (!USE_DEMO_MODE && SUPABASE_URL !== 'https://tfnvacmwachpadhekfzm.supabase.co') {
      const { createClient } = window.supabase;
      supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    }
    
    let users = [
      { id: 1, name: 'John Doe', email: 'john@example.com', role: 'user', ideas: 3, comments: 12, joined: '2025-01-15', status: 'Active' },
      { id: 2, name: 'Admin User', email: 'admin@nairobi.gov', role: 'admin', ideas: 0, comments: 5, joined: '2024-12-01', status: 'Active' },
      { id: 3, name: 'Sarah Kimani', email: 'sarah@example.com', role: 'user', ideas: 5, comments: 18, joined: '2025-02-01', status: 'Active' },
      { id: 4, name: 'Mike Johnson', email: 'mike@company.com', role: 'user', ideas: 1, comments: 3, joined: '2025-02-10', status: 'Pending' }
    ];

    function viewUser(id) {
      const user = users.find(u => u.id === id);
      if (user) alert(`User: ${user.name}\nEmail: ${user.email}\nRole: ${user.role}\nIdeas: ${user.ideas}\nComments: ${user.comments}`);
    }

    function editUser(id) {
      const user = users.find(u => u.id === id);
      if (user) {
        const newRole = prompt('Enter new role (user/admin):', user.role);
        if (newRole) {
          user.role = newRole;
          renderUsers();
          showToast('User updated!');
        }
      }
    }

    function deleteUser(id) {
      const user = users.find(u => u.id === id);
      if (user && confirm(`Delete user "${user.name}"?`)) {
        users = users.filter(u => u.id !== id);
        renderUsers();
        showToast('User deleted!');
      }
    }

    function toggleUserStatus(id) {
      const user = users.find(u => u.id === id);
      if (user) {
        user.status = user.status === 'Active' ? 'Suspended' : 'Active';
        renderUsers();
        showToast(`User ${user.status === 'Active' ? 'activated' : 'suspended'}!`);
      }
    }

    function addUser() {
      const email = document.getElementById('userEmail').value;
      const name = document.getElementById('userName').value;
      const role = document.getElementById('userRole').value;
      
      if (!email || !name) {
        alert('Please fill in all fields');
        return;
      }
      
      users.unshift({
        id: Date.now(), name, email, role,
        ideas: 0, comments: 0,
        joined: new Date().toISOString().split('T')[0],
        status: 'Active'
      });
      
      renderUsers();
      bootstrap.Modal.getInstance(document.getElementById('addUserModal')).hide();
      document.getElementById('addUserForm').reset();
      showToast('User added successfully!');
    }

    function renderUsers() {
      document.getElementById('users-table').innerHTML = users.map(user => `
        <tr>
          <td class="px-4">
            <div class="d-flex align-items-center">
              <div class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center me-2" style="width:36px;height:36px;">${user.name.charAt(0)}</div>
              <div>
                <div class="fw-medium">${user.name}</div>
                <small class="text-muted">${user.email}</small>
              </div>
            </div>
          </td>
          <td><span class="badge ${user.role === 'admin' ? 'bg-danger' : 'bg-secondary'}">${user.role}</span></td>
          <td>${user.ideas}</td>
          <td>${user.comments}</td>
          <td class="text-muted">${user.joined}</td>
          <td><span class="badge ${user.status === 'Active' ? 'bg-success' : 'bg-warning'}">${user.status}</span></td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="viewUser(${user.id})"><i class="bi bi-eye"></i></button>
            <button class="btn btn-sm btn-outline-warning me-1" onclick="editUser(${user.id})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-${user.status === 'Active' ? 'danger' : 'success'}" onclick="toggleUserStatus(${user.id})">
              <i class="bi bi-${user.status === 'Active' ? 'ban' : 'check'}"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'position-fixed bottom-0 end-0 m-3 alert alert-success shadow';
      toast.style.zIndex = '9999';
      toast.innerHTML = '<i class="bi bi-check-circle me-2"></i>' + message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    renderUsers();
  </script>
</body>
</html>
