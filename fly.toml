app = "nairobitalks-ncg"

primary_region = "ams"

[build]
  builder = "paketobuildpacks/builder:base"
    image = ""

[env]
  RAILS_ENV = "production"

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
