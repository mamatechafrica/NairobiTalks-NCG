name: nairobitalks
platform: gcp
region: us-central1
services:
  web:
    type: web
    dockerfile: Dockerfile
    command: bash -lc "bundle exec puma -C config/puma.rb"
    env:
      RAILS_ENV: production
      RACK_ENV: production
      RAILS_SERVE_STATIC_FILES: enabled
    ports:
      - ${PORT:-8080}
    instance_class: F1
    disk_size_gb: 10
    memory_mb: 1024
    build:
      cache: true
      args:
        BUNDLE_WITHOUT: "development:test"
