<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Ideas - Admin - Nairobi Talks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --color-primary: #004225; }
    .bg-dark-green { background-color: #004225 !important; }
    .sidebar { min-height: 100vh; background: #1a1a1a; }
    .sidebar a { color: #aaa; text-decoration: none; padding: 12px 20px; display: block; }
    .sidebar a:hover, .sidebar a.active { background: #333; color: #fff; }
  </style>
</head>
<body class="bg-light">
  <div class="d-flex">
    <!-- Sidebar -->
    <nav class="sidebar d-none d-md-block" style="width:250px;position:fixed;height:100vh;">
      <div class="p-3">
        <h5 class="text-white fw-bold">Nairobi Talks</h5>
        <small class="text-white-50">Admin Panel</small>
      </div>
      <hr class="border-secondary">
      <a href="index.html"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
      <a href="ideas.html" class="active"><i class="bi bi-lightbulb me-2"></i> Community Ideas</a>
      <a href="documents.html"><i class="bi bi-file-earmark-text me-2"></i> Planning Documents</a>
      <a href="users.html"><i class="bi bi-people me-2"></i> Users</a>
      <a href="analytics.html"><i class="bi bi-graph-up me-2"></i> Analytics</a>
      <a href="broadcasts.html"><i class="bi bi-megaphone me-2"></i> Broadcasts</a>
      <a href="forums.html"><i class="bi bi-chat-dots me-2"></i> Forum</a>
      <hr class="border-secondary">
      <a href="../index.html"><i class="bi bi-house me-2"></i> View Site</a>
      <a href="#"><i class="bi bi-box-arrow-left me-2"></i> Logout</a>
    </nav>

    <!-- Main Content -->
    <div class="flex-grow-1 p-4" style="margin-left:250px;">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="mb-1 fw-bold" style="color:#009339;">Community Ideas</h2>
          <p class="text-muted mb-0">Manage and moderate community-submitted ideas</p>
        </div>
        <button class="btn btn-success"><i class="bi bi-plus-circle me-2"></i>New Idea</button>
      </div>

      <!-- Filters -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-3">
              <input type="text" class="form-control" placeholder="Search ideas...">
            </div>
            <div class="col-md-2">
              <select class="form-select">
                <option>All Status</option>
                <option>New</option>
                <option>Under Review</option>
                <option>Approved</option>
                <option>Implemented</option>
              </select>
            </div>
            <div class="col-md-2">
              <select class="form-select">
                <option>All Topics</option>
                <option>Transportation</option>
                <option>Environment</option>
                <option>Education</option>
                <option>Health</option>
              </select>
            </div>
            <div class="col-md-2">
              <select class="form-select">
                <option>All Sub-counties</option>
                <option>Westlands</option>
                <option>Kibra</option>
                <option>Embakasi</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-secondary w-100">Filter</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Ideas Table -->
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th class="px-4">Title</th>
                  <th>Author</th>
                  <th>Topic</th>
                  <th>Sub-county</th>
                  <th>Status</th>
                  <th>Votes</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="ideas-table">
                <!-- Loaded via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const USE_DEMO_MODE = true;
    
    let supabase;
    if (!USE_DEMO_MODE && SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
      const { createClient } = window.supabase;
      supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    }
    
    // ============================================
    // MOCK DATA
    // ============================================
    let ideas = [
      { id: 1, title: 'Improve Public Transport in Westlands', author: 'john@example.com', topic: 'Transportation', sub_county: 'Westlands', status: 'Under Review', votes: 45, date: '2025-02-20' },
      { id: 2, title: 'Community Garden in Kibra', author: 'Anonymous', topic: 'Environment', sub_county: 'Kibra', status: 'New', votes: 32, date: '2025-02-19' },
      { id: 3, title: 'Digital Literacy Program', author: 'sarah@nairobi.gov', topic: 'Education', sub_county: 'Dagoretti', status: 'Approved', votes: 67, date: '2025-02-18' },
      { id: 4, title: 'Street Lighting Eastleigh', author: 'mike@company.com', topic: 'Infrastructure', sub_county: 'Starehe', status: 'Under Review', votes: 28, date: '2025-02-17' },
      { id: 5, title: 'Mobile Health Clinics', author: 'Anonymous', topic: 'Health', sub_county: 'Embakasi', status: 'New', votes: 51, date: '2025-02-16' }
    ];

    // ============================================
    // DATA LOADING
    // ============================================
    async function loadIdeas() {
      if (USE_DEMO_MODE) {
        renderIdeas();
        return;
      }
      
      try {
        const { data } = await supabase.from('ideas').select('*').order('created_at', { ascending: false });
        if (data) ideas = data;
      } catch (e) {
        console.log('Error:', e);
      }
      renderIdeas();
    }

    function getStatusBadge(status) {
      const colors = { 'New': 'bg-primary', 'Under Review': 'bg-warning text-dark', 'Approved': 'bg-info', 'Implemented': 'bg-success' };
      return colors[status] || 'bg-secondary';
    }

    // ============================================
    // ACTIONS
    // ============================================
    function viewIdea(id) {
      const idea = ideas.find(i => i.id === id);
      if (idea) {
        alert(`Viewing: ${idea.title}\n\nDescription: ${idea.description || 'N/A'}\n\nAuthor: ${idea.author}\nStatus: ${idea.status}`);
      }
    }

    function approveIdea(id) {
      const idea = ideas.find(i => i.id === id);
      if (idea) {
        if (confirm(`Approve "${idea.title}"?`)) {
          idea.status = 'Approved';
          renderIdeas();
          showToast('Idea approved successfully!');
          
          if (!USE_DEMO_MODE && supabase) {
            supabase.from('ideas').update({ status: 'approved' }).eq('id', id).then();
          }
        }
      }
    }

    function deleteIdea(id) {
      const idea = ideas.find(i => i.id === id);
      if (idea) {
        if (confirm(`Are you sure you want to delete "${idea.title}"?`)) {
          ideas = ideas.filter(i => i.id !== id);
          renderIdeas();
          showToast('Idea deleted successfully!');
          
          if (!USE_DEMO_MODE && supabase) {
            supabase.from('ideas').delete().eq('id', id).then();
          }
        }
      }
    }

    function filterIdeas() {
      const status = document.querySelector('select:nth-of-type(1)').value;
      const topic = document.querySelector('select:nth-of-type(2)').value;
      const subcounty = document.querySelector('select:nth-of-type(3)').value;
      
      let filtered = ideas;
      if (status !== 'All') filtered = filtered.filter(i => i.status === status);
      if (topic !== 'All Topics') filtered = filtered.filter(i => i.topic === topic);
      if (subcounty !== 'All Sub-counties') filtered = filtered.filter(i => i.sub_county === subcounty);
      
      renderFilteredIdeas(filtered);
    }

    function renderFilteredIdeas(filteredIdeas) {
      document.getElementById('ideas-table').innerHTML = filteredIdeas.map(idea => `
        <tr>
          <td class="px-4 fw-medium">${idea.title}</td>
          <td>${idea.author}</td>
          <td>${idea.topic}</td>
          <td>${idea.sub_county}</td>
          <td><span class="badge ${getStatusBadge(idea.status)}">${idea.status}</span></td>
          <td>${idea.votes}</td>
          <td class="text-muted">${idea.date}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1" onclick="viewIdea(${idea.id})"><i class="bi bi-eye"></i></button>
            <button class="btn btn-sm btn-outline-success me-1" onclick="approveIdea(${idea.id})"><i class="bi bi-check"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteIdea(${idea.id})"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    function renderIdeas() {
      renderFilteredIdeas(ideas);
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'position-fixed bottom-0 end-0 m-3 alert alert-success shadow';
      toast.style.zIndex = '9999';
      toast.innerHTML = '<i class="bi bi-check-circle me-2"></i>' + message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // Filter button handler
    document.querySelector('.btn-outline-secondary')?.addEventListener('click', filterIdeas);

    loadIdeas();
  </script>
</body>
</html>
