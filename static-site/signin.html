<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Nairobi Talks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --color-primary: #004225; }
    .bg-dark-green { background-color: #004225 !important; }
    .text-dark-green { color: #004225 !important; }
  </style>
</head>
<body class="bg-light min-vh-100 d-flex flex-column">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-dark-green text-white" style="padding: 0.6rem 0;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="images/NairobiTalksLogo.png" alt="Nairobi Talks" style="height:80px;width:auto;border-radius:0.375rem;">
      </a>
    </div>
  </nav>

  <div class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card border-0 shadow-lg">
            <div class="card-body p-5">
              <div class="text-center mb-4">
                <h2 class="fw-bold text-success">Welcome Back</h2>
                <p class="text-muted">Sign in to your account</p>
              </div>

              <form onsubmit="signIn(event)">
                <div class="mb-3">
                  <label for="email" class="form-label fw-semibold">Email</label>
                  <input type="email" class="form-control form-control-lg" id="email" required placeholder="your@email.com">
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label fw-semibold">Password</label>
                  <input type="password" class="form-control form-control-lg" id="password" required placeholder="••••••••">
                </div>

                <div class="mb-3 form-check">
                  <input type="checkbox" class="form-check-input" id="remember">
                  <label class="form-check-label" for="remember">Remember me</label>
                </div>

                <button type="submit" class="btn btn-success w-100 btn-lg fw-semibold">Sign In</button>
              </form>

              <div class="text-center mt-4">
                <p class="text-muted mb-0">Don't have an account? <a href="signup.html" class="text-success fw-semibold">Sign up</a></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark-green text-white py-4">
    <div class="container text-center">
      <p class="mb-0">© 2025 Nairobi Talks <span class="mx-2">|</span> <a href="admin/index.html" class="text-white-50 text-decoration-none">Admin Panel</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function signIn(e) {
      e.preventDefault();
      alert('Signed in! (Demo mode)');
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
