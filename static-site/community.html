<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Ideas - Nairobi Talks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --color-primary: #004225; }
    .bg-dark-green { background-color: #004225 !important; }
    .text-dark-green { color: #004225 !important; }
  </style>
</head>
<body class="bg-light min-vh-100 d-flex flex-column">
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-dark-green text-white" style="padding: 0.6rem 0;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="images/NairobiTalksLogo.png" alt="Nairobi Talks" style="height:80px;width:auto;border-radius:0.375rem;">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a href="community.html" class="btn btn-light text-dark-green fw-semibold px-3 py-2">Community Ideas</a>
          </li>
        </ul>
        <div class="d-flex gap-2">
          <a href="submit.html" class="btn btn-light text-dark-green fw-semibold px-3 py-2">Submit Idea</a>
          <a href="signin.html" class="btn btn-outline-light">Sign in</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <h1 class="mb-4 fw-bold" style="color: #004225;">Explore Community Ideas</h1>
    
    <!-- Filters -->
    <form class="row gx-3 gy-2 align-items-end p-3 rounded shadow-sm mb-4" style="background:#fff;border:2px solid #004225;">
      <div class="col-md-3 col-6">
        <label class="form-label fw-bold" style="color:#004225;">Search</label>
        <input type="text" class="form-control border-success fw-bold" placeholder="Search ideas..." style="border-width:2px;">
      </div>
      <div class="col-md-3 col-6">
        <label class="form-label fw-bold" style="color:#004225;">Sub-county</label>
        <select class="form-select border-success fw-bold" style="border-width:2px;">
          <option>All</option>
          <option>Westlands</option>
          <option>Dagoretti North</option>
          <option>Dagoretti South</option>
          <option>Langata</option>
          <option>Kibra</option>
          <option>Embakasi</option>
        </select>
      </div>
      <div class="col-md-2 col-6">
        <label class="form-label fw-bold" style="color:#004225;">Topic</label>
        <select class="form-select border-success fw-bold" style="border-width:2px;">
          <option>All</option>
          <option>Transportation</option>
          <option>Environment</option>
          <option>Education</option>
          <option>Health</option>
          <option>Infrastructure</option>
        </select>
      </div>
      <div class="col-md-2 col-6">
        <label class="form-label fw-bold" style="color:#004225;">Status</label>
        <select class="form-select border-success fw-bold" style="border-width:2px;">
          <option>All</option>
          <option>New</option>
          <option>Under Review</option>
          <option>Approved</option>
          <option>Implemented</option>
        </select>
      </div>
      <div class="col-md-2 col-12">
        <button type="submit" class="btn fw-bold w-100" style="background:#004225;color:#fff;">Search</button>
      </div>
    </form>

    <!-- Ideas Grid -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="ideas-grid">
      <!-- Loaded via JS -->
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark-green text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0">© 2025 Nairobi Talks <span class="mx-2">|</span> <a href="admin/index.html" class="text-white-50 text-decoration-none">Admin Panel</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const USE_DEMO_MODE = true; // Set to false when Supabase is configured
    
    // ============================================
    // SUPABASE CLIENT
    // ============================================
    let supabase;
    if (!USE_DEMO_MODE && SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
      const { createClient } = window.supabase;
      supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    }
    
    // ============================================
    // MOCK DATA (Demo Mode)
    // ============================================
    let ideas = [
      { id: '1', title: 'Improve Public Transport in Westlands', description: 'Add more bus routes and dedicated lanes to reduce commute times for thousands of commuters.', topic: 'Transportation', sub_county: 'Westlands', status: 'Under Review', votes_up: 45, votes_down: 3 },
      { id: '2', title: 'Community Garden in Kibra', description: 'Create urban gardens to improve food security and provide community spaces for residents.', topic: 'Environment', sub_county: 'Kibra', status: 'New', votes_up: 32, votes_down: 8 },
      { id: '3', title: 'Digital Literacy Program for Youth', description: 'Free computer training for unemployed youth to improve their job prospects.', topic: 'Education', sub_county: 'Dagoretti North', status: 'Approved', votes_up: 67, votes_down: 2 },
      { id: '4', title: 'Better Street Lighting in Eastleigh', description: 'Install LED street lights to improve safety in commercial areas.', topic: 'Infrastructure', sub_county: 'Starehe', status: 'Under Review', votes_up: 28, votes_down: 5 },
      { id: '5', title: 'Mobile Health Clinics', description: 'Bring basic healthcare services to underserved areas of Nairobi.', topic: 'Health', sub_county: 'Embakasi', status: 'New', votes_up: 51, votes_down: 9 },
      { id: '6', title: 'Recycling Program for Residential Areas', description: 'Implement weekly recycling collection to reduce waste.', topic: 'Environment', sub_county: 'Langata', status: 'Implemented', votes_up: 89, votes_down: 4 }
    ];

    let votedIdeas = new Set();

    // ============================================
    // DATA LOADING
    // ============================================
    async function loadIdeas() {
      const grid = document.getElementById('ideas-grid');
      
      if (USE_DEMO_MODE) {
        renderIdeas();
        return;
      }

      try {
        const { data, error } = await supabase
          .from('ideas')
          .select('*, comments(id)')
          .order('created_at', { ascending: false });
        
        if (error) throw error;
        if (data) ideas = data;
      } catch (e) {
        console.log('Error loading ideas:', e);
      }

      renderIdeas();
    }

    function getStatusBadge(status) {
      const colors = {
        'New': 'bg-primary',
        'Under Review': 'bg-warning text-dark',
        'Approved': 'bg-info',
        'Implemented': 'bg-success'
      };
      return colors[status] || 'bg-secondary';
    }

    // ============================================
    // VOTING
    // ============================================
    async function vote(ideaId, type, btn) {
      if (votedIdeas.has(ideaId)) {
        alert('You have already voted on this idea!');
        return;
      }

      const idea = ideas.find(i => i.id === ideaId);
      if (!idea) return;

      // Update local state immediately
      if (type === 'up') idea.votes_up++;
      else idea.votes_down++;
      votedIdeas.add(ideaId);
      renderIdeas();
      
      // Show toast
      showToast('Vote recorded!');

      // Save to Supabase if configured
      if (!USE_DEMO_MODE && supabase) {
        try {
          // Record the vote
          await supabase.from('votes').insert({
            idea_id: ideaId,
            vote_type: type
          });
          
          // Update idea counts
          const updateField = type === 'up' ? 'votes_up' : 'votes_down';
          await supabase.rpc('increment_vote', { 
            idea_id: ideaId, 
            vote_field: updateField 
          });
        } catch (e) {
          console.log('Error saving vote:', e);
        }
      }
    }

    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'position-fixed bottom-0 end-0 m-3 alert alert-success shadow';
      toast.style.zIndex = '9999';
      toast.innerHTML = '<i class="bi bi-check-circle me-2"></i>' + message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }

    // ============================================
    // RENDERING
    // ============================================
    function renderIdeas() {
      const grid = document.getElementById('ideas-grid');
      grid.innerHTML = ideas.map(idea => {
        const hasVoted = votedIdeas.has(idea.id);
        const totalVotes = idea.votes_up || 0;
        const commentCount = idea.comments ? idea.comments.length : 0;
        
        return `
        <div class="col">
          <div class="card h-100 border-0 shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <span class="badge bg-success">${idea.topic || 'General'}</span>
                <span class="badge ${getStatusBadge(idea.status)}">${idea.status || 'New'}</span>
              </div>
              <h5 class="card-title fw-bold text-dark">${idea.title}</h5>
              <p class="card-text text-muted small">${idea.description || ''}</p>
              <div class="d-flex align-items-center text-muted small mb-3">
                <i class="bi bi-geo-alt me-1"></i> ${idea.sub_county || 'Nairobi'}
              </div>
              <div class="d-flex gap-2 mb-2">
                <button class="btn btn-sm ${hasVoted ? 'btn-success' : 'btn-outline-success'}" onclick="vote('${idea.id}', 'up', this)" ${hasVoted ? 'disabled' : ''}>
                  <i class="bi bi-hand-thumbs-up"></i> Yes (${totalVotes})
                </button>
                <button class="btn btn-sm ${hasVoted ? 'btn-danger' : 'btn-outline-danger'}" onclick="vote('${idea.id}', 'down', this)" ${hasVoted ? 'disabled' : ''}>
                  <i class="bi bi-hand-thumbs-down"></i> No (${idea.votes_down || 0})
                </button>
              </div>
            </div>
            <div class="card-footer bg-transparent border-0 d-flex justify-content-between align-items-center">
              <div>
                <span class="text-muted small"><i class="bi bi-chat me-1"></i> ${commentCount} comments</span>
              </div>
              <a href="community-show.html?id=${idea.id}" class="btn btn-outline-success btn-sm">View</a>
            </div>
          </div>
        </div>
      `}).join('');
    }

    // ============================================
    // REAL-TIME SUBSCRIPTIONS
    // ============================================
    if (!USE_DEMO_MODE && supabase) {
      supabase
        .channel('ideas')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'ideas' }, () => {
          loadIdeas();
        })
        .subscribe();
    }

    loadIdeas();
  </script>
</body>
</html>
